name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Swift 6.3)
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      matrix:
        xcode: ["26.4"]
        config: ["debug", "release"]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Run ${{ matrix.config }} tests
        run: swift test -c ${{ matrix.config }} --disable-experimental-prebuilts --enable-all-traits

  can-i-climb:
    name: CanIClimbKit (Swift 6.3)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Examples/CanIClimb/CanIClimbKit
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - name: Run tests
        run: >-
          swift test
          --disable-experimental-prebuilts
          --skip MountainClimbReadinessFoundationModelsTests

  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.1"
            container: "swift:6.1"
            flags: ""
          - swift: "6.2"
            container: "swift:6.2"
            flags: "--disable-experimental-prebuilts"
          - swift: "6.3"
            container: "swift:6.3"
            flags: "--disable-experimental-prebuilts"
          # NB: 6.4 has no release image yet, so track the release branch nightly.
          - swift: "6.4"
            container: "swiftlang/swift:nightly-6.4.x-jammy"
            flags: "--disable-experimental-prebuilts"
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test --traits SwiftOperationLogging ${{ matrix.flags }}

  android:
    name: Android (Swift 6.3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: "Build Swift Package on Android"
        uses: swift-android-sdk/swift-android-action@v2
        with:
          swift-version: 6.3
          swift-build-flags: --traits SwiftOperationLogging --disable-experimental-prebuilts
          run-tests: false
          build-tests: false

  windows:
    name: Windows (Swift 6.3)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: "Setup Swift on Windows"
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.3-release
          tag: 6.3-RELEASE
      - name: "Build Swift Package on Windows"
        run: swift build --target Operation --traits SwiftOperationLogging

  wasm:
    name: WASM (Swift 6.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install Swift and Swift SDK for WebAssembly
        run: |
          PREFIX=/opt/swift
          set -ex
          curl -f -o /tmp/swift.tar.gz "https://download.swift.org/swift-6.3.2-release/ubuntu2204/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE-ubuntu22.04.tar.gz"
          sudo mkdir -p $PREFIX; sudo tar -xzf /tmp/swift.tar.gz -C $PREFIX --strip-component 1
          $PREFIX/usr/bin/swift sdk install https://download.swift.org/swift-6.3.2-release/wasm-sdk/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE_wasm.artifactbundle.tar.gz --checksum a61f0584c93283589f8b2f42db05c1f9a182b506c2957271402992655591dd7c
          echo "$PREFIX/usr/bin" >> $GITHUB_PATH
      - name: Install Playwright
        run: npm install playwright && npx playwright install chromium
      - name: Run tests
        run: ./test-wasm.sh

  wasm-demo:
    name: WASM Demo (Swift 6.3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Examples/WASMDemo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install Swift and the multithreaded Swift SDK for WebAssembly
        run: |
          PREFIX=/opt/swift
          set -ex
          curl -f -o /tmp/swift.tar.gz "https://download.swift.org/swift-6.3.2-release/ubuntu2204/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE-ubuntu22.04.tar.gz"
          sudo mkdir -p $PREFIX; sudo tar -xzf /tmp/swift.tar.gz -C $PREFIX --strip-component 1
          # NB: The demo uses WebWorkerTaskExecutor, which needs a wasip1-threads SDK. swift.org
          # only publishes single threaded ones, so use swiftwasm's bundle, which is built from the
          # same swift-6.3.2-RELEASE tag as the toolchain above.
          $PREFIX/usr/bin/swift sdk install https://github.com/swiftwasm/swift/releases/download/swift-wasm-6.3-SNAPSHOT-2026-08-14-a/swift-wasm-6.3-SNAPSHOT-2026-08-14-a-wasm32-unknown-wasip1-threads.artifactbundle.zip --checksum 8329ea9b7a35a59df46515c518d9f7c669e5f8c5be91f7ec260e2cef6f3352ab
          echo "$PREFIX/usr/bin" >> $GITHUB_PATH
      - name: Install JS dependencies
        run: npm install && npx playwright install chromium
      # NB: The test target does not depend on the WASMDemo executable, so build the app as well to
      # keep the entry point and its multithreading setup covered.
      - name: Build the app
        run: ./build.sh
      - name: Run tests
        run: ./test.sh
